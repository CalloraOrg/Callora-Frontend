<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Callora — Programmable API Access</title>
    <meta name="description" content="Callora is a pay-per-call API marketplace on Stellar: fund a USDC vault, call APIs, pay per request." />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Callora" />
    <meta property="og:title" content="Callora — Programmable API Access" />
    <meta property="og:description" content="Callora is a pay-per-call API marketplace on Stellar: fund a USDC vault, call APIs, pay per request." />
    <meta property="og:url" content="https://callora-frontend-six.vercel.app/" />
    <meta property="og:image" content="https://callora-frontend-six.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Callora — Programmable API Access" />
    <meta name="twitter:description" content="Callora is a pay-per-call API marketplace on Stellar: fund a USDC vault, call APIs, pay per request." />
    <meta name="twitter:image" content="https://callora-frontend-six.vercel.app/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Pre-paint theme resolution to prevent flash of incorrect theme
      (function() {
        try {
          let savedTheme = localStorage.getItem('callora-theme');
          try { savedTheme = JSON.parse(localStorage.getItem('callora.prefs') || '{}').theme || savedTheme; } catch (_) {}
          let theme = 'dark'; // default (matches userPrefs)
          
          if (savedTheme === 'light' || savedTheme === 'dark') {
            theme = savedTheme;
          } else if (savedTheme === 'system') {
            // Check system preference
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // Fallback to dark if localStorage is not available (e.g., in private browsing)
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="font-family: 'Space Grotesk', 'Segoe UI', sans-serif; max-width: 36rem; margin: 4rem auto; padding: 1.5rem; text-align: center;">
        <h1>JavaScript is required</h1>
        <p>Callora is an interactive web application and needs JavaScript enabled to run.</p>
        <p>
          You can still read the
          <a href="https://github.com/CalloraOrg/Callora-Frontend/blob/main/docs/README.md">Callora documentation</a>
          while JavaScript is disabled.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
